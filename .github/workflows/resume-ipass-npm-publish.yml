name: Resume Yingdao iPaaS DWS npm publication

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed build run containing the npm-staging artifact"
        required: true
        type: string
      npm_version:
        description: "Exact prepared npm version, without a leading v"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ipass-npm-resume-${{ inputs.npm_version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Resume exact npm version from immutable staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate recovery inputs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          NPM_VERSION: ${{ inputs.npm_version }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "source_run_id must be a positive GitHub Actions run id." >&2
            exit 1
          }
          [[ "$NPM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-ipass\.[1-9][0-9]*$ ]] || {
            echo "npm_version must look like <upstream>-ipass.<positive integer>." >&2
            exit 1
          }

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          RUN_JSON="$run_json" NPM_VERSION="$NPM_VERSION" node <<'NODE'
          const run = JSON.parse(process.env.RUN_JSON);
          const expectedTag = `v${process.env.NPM_VERSION}`;
          const expected = {
            status: "completed",
            event: "push",
            head_branch: expectedTag,
            path: ".github/workflows/publish-ipass-npm.yml",
          };
          for (const [field, value] of Object.entries(expected)) {
            if (run[field] !== value) {
              throw new Error(
                `Source run ${run.id} has unexpected ${field}: ${JSON.stringify(run[field])}; expected ${JSON.stringify(value)}`,
              );
            }
          }
          if (!['success', 'failure'].includes(run.conclusion)) {
            throw new Error(
              `Source run ${run.id} must have a final success or failure conclusion; received ${JSON.stringify(run.conclusion)}`,
            );
          }
          if (!/^[0-9a-f]{40}$/.test(run.head_sha || "")) {
            throw new Error(`Source run ${run.id} has an invalid head SHA.`);
          }
          NODE
          run_sha="$(RUN_JSON="$run_json" node -p 'JSON.parse(process.env.RUN_JSON).head_sha')"
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/v${NPM_VERSION}" --jq .sha)"
          [[ "$run_sha" == "$tag_sha" ]] || {
            echo "Source run SHA does not match the current v${NPM_VERSION} tag." >&2
            exit 1
          }

          artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts")"
          ARTIFACT_JSON="$artifact_json" node <<'NODE'
          const response = JSON.parse(process.env.ARTIFACT_JSON);
          const candidates = (response.artifacts || []).filter(
            (artifact) => artifact.name === "npm-staging" && artifact.expired === false,
          );
          if (candidates.length !== 1) {
            throw new Error(
              `Source run must contain exactly one unexpired npm-staging artifact; found ${candidates.length}.`,
            );
          }
          NODE
          echo "Verified source run ${SOURCE_RUN_ID} for tag v${NPM_VERSION}."

      - name: Download immutable npm staging from the build run
        uses: actions/download-artifact@v7
        with:
          name: npm-staging
          path: .release/npm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Validate npm token
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "Missing repository secret NPM_TOKEN." >&2
            exit 1
          fi
          npm whoami --registry https://registry.npmjs.org >/dev/null

      - name: Resume exact version idempotently
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_VERSION: ${{ inputs.npm_version }}
        run: node scripts/release/publish-ipass-npm.mjs
